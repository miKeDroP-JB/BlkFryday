<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6af" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#48f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow)"/>

  <!-- Outer ring of dots -->
  <g fill="#8af" opacity="0.8">
    <circle cx="200" cy="40" r="4"/>
    <circle cx="248" cy="46" r="3.5"/>
    <circle cx="292" cy="64" r="3.5"/>
    <circle cx="328" cy="92" r="3.5"/>
    <circle cx="354" cy="128" r="3.5"/>
    <circle cx="368" cy="172" r="4"/>
    <circle cx="368" cy="218" r="3.5"/>
    <circle cx="354" cy="262" r="3.5"/>
    <circle cx="328" cy="298" r="3.5"/>
    <circle cx="292" cy="326" r="3.5"/>
    <circle cx="248" cy="344" r="3.5"/>
    <circle cx="200" cy="350" r="4"/>
    <circle cx="152" cy="344" r="3.5"/>
    <circle cx="108" cy="326" r="3.5"/>
    <circle cx="72" cy="298" r="3.5"/>
    <circle cx="46" cy="262" r="3.5"/>
    <circle cx="32" cy="218" r="3.5"/>
    <circle cx="32" cy="172" r="4"/>
    <circle cx="46" cy="128" r="3.5"/>
    <circle cx="72" cy="92" r="3.5"/>
    <circle cx="108" cy="64" r="3.5"/>
    <circle cx="152" cy="46" r="3.5"/>
  </g>

  <!-- Inner triangle of dots -->
  <g fill="#adf" opacity="0.9">
    <!-- Top vertex -->
    <circle cx="200" cy="100" r="5"/>
    <circle cx="200" cy="115" r="3"/>

    <!-- Left edge -->
    <circle cx="180" cy="130" r="3"/>
    <circle cx="160" cy="160" r="3"/>
    <circle cx="140" cy="190" r="3"/>
    <circle cx="120" cy="220" r="3"/>
    <circle cx="110" cy="250" r="3"/>
    <circle cx="105" cy="270" r="4"/>

    <!-- Right edge -->
    <circle cx="220" cy="130" r="3"/>
    <circle cx="240" cy="160" r="3"/>
    <circle cx="260" cy="190" r="3"/>
    <circle cx="280" cy="220" r="3"/>
    <circle cx="290" cy="250" r="3"/>
    <circle cx="295" cy="270" r="4"/>

    <!-- Bottom edge -->
    <circle cx="130" cy="280" r="3"/>
    <circle cx="155" cy="285" r="3"/>
    <circle cx="180" cy="288" r="3"/>
    <circle cx="200" cy="290" r="3"/>
    <circle cx="220" cy="288" r="3"/>
    <circle cx="245" cy="285" r="3"/>
    <circle cx="270" cy="280" r="3"/>
  </g>

  <!-- Center orb -->
  <circle cx="200" cy="195" r="20" fill="#fff" opacity="0.9" filter="url(#blur)"/>
  <circle cx="200" cy="195" r="12" fill="#fff"/>

  <!-- Secondary orbs -->
  <circle cx="175" cy="210" r="6" fill="#adf" opacity="0.7"/>
  <circle cx="225" cy="210" r="6" fill="#adf" opacity="0.7"/>
</svg>