version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: blkf
      POSTGRES_PASSWORD: blkfpass
      POSTGRES_DB: blkf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blkf -d blkf"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: packages/infra/Dockerfile.api
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://blkf:blkfpass@postgres:5432/blkf
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: packages/infra/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://blkf:blkfpass@postgres:5432/blkf
      WORKER_CONCURRENCY: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: blk-network
