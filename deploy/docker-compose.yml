# ═══════════════════════════════════════════════════════════════════
# 0RB SYSTEM - DOCKER COMPOSE
# ═══════════════════════════════════════════════════════════════════
# Complete stack deployment
# Brain runs locally, Web can be deployed to cloud
# ═══════════════════════════════════════════════════════════════════

version: '3.9'

services:
  # ═══════════════════════════════════════════════════════════════
  # BRAIN SERVER - Local Xeon
  # ═══════════════════════════════════════════════════════════════
  brain:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.brain
    container_name: orb-brain
    restart: unless-stopped
    ports:
      - "8420:8420"   # HTTP API
      - "8421:8421"   # WebSocket
    environment:
      - NODE_ENV=production
      - BRAIN_PORT=8420
      - WS_PORT=8421
      - BRAIN_AUTH_TOKEN=${BRAIN_AUTH_TOKEN:-orb-secure-token-change-me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - orb-data:/orb/data
      - orb-logs:/orb/logs
    networks:
      - orb-network
    deploy:
      resources:
        limits:
          cpus: '0'  # No limit - use all Xeon cores
          memory: 32G
        reservations:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # WEB FRONTEND - Cloud Ready
  # ═══════════════════════════════════════════════════════════════
  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
    container_name: orb-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BRAIN_URL=http://brain:8420
      - BRAIN_WS_URL=ws://brain:8421
      - BRAIN_AUTH_TOKEN=${BRAIN_AUTH_TOKEN:-orb-secure-token-change-me}
      - NEXT_PUBLIC_BRAIN_URL=${NEXT_PUBLIC_BRAIN_URL:-http://localhost:8420}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8421}
    depends_on:
      brain:
        condition: service_healthy
    networks:
      - orb-network

  # ═══════════════════════════════════════════════════════════════
  # REDIS - Session & Cache (Optional)
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: orb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - orb-network
    command: redis-server --appendonly yes

  # ═══════════════════════════════════════════════════════════════
  # NGINX - Reverse Proxy (Production)
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: orb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - brain
    networks:
      - orb-network
    profiles:
      - production

networks:
  orb-network:
    driver: bridge

volumes:
  orb-data:
  orb-logs:
  redis-data:
