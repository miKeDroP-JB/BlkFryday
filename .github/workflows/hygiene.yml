name: Code Hygiene

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  hygiene:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check for unused dependencies
        run: |
          echo "Checking for unused dependencies..."
          npx depcheck --ignores="electron,@anthropic-ai/sdk,openai,ethers,web3" || true

      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          npm outdated || true

      - name: Run security audit
        run: |
          echo "Running security audit..."
          npm audit --audit-level=high || true

      - name: Check test coverage
        run: |
          echo "Running tests with coverage..."
          npx jest --coverage --testPathIgnorePatterns=node_modules --passWithNoTests || true

      - name: Generate hygiene report
        run: |
          echo "# Code Hygiene Report - $(date)" > hygiene-report.md
          echo "" >> hygiene-report.md
          echo "## Test Results" >> hygiene-report.md
          npx jest --testPathIgnorePatterns=node_modules --passWithNoTests 2>&1 | tail -20 >> hygiene-report.md || true
          echo "" >> hygiene-report.md
          echo "## Outdated Packages" >> hygiene-report.md
          npm outdated 2>&1 >> hygiene-report.md || echo "All packages up to date" >> hygiene-report.md

      - name: Upload hygiene report
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-report
          path: hygiene-report.md
