# ╔══════════════════════════════════════════════════════════════════════╗
# ║  VYRA: GENESIS SECTOR - CORE CONFIGURATION                          ║
# ║  Master Configuration for the Sovereign Development Universe        ║
# ╚══════════════════════════════════════════════════════════════════════╝

[system]
name = "Genesis Sector"
version = "1.0.0"
codename = "Neon Ritual"
build_date = "2024"

[paths]
home = "/home/vyra"
config = "/etc/vyra"
data = "/var/lib/vyra"
cache = "/var/cache/vyra"
logs = "/var/log/vyra"
agents = "/var/lib/vyra/agents"
models = "/var/lib/vyra/models"
swarm = "/var/lib/vyra/swarm"

[ai]
default_provider = "ollama"
ollama_host = "http://localhost:11434"
default_model = "llama3.1:8b"
embedding_model = "nomic-embed-text"
tts_engine = "piper"
stt_engine = "whisper"

[swarm]
enabled = true
max_agents = 32
orchestrator_port = 9999
message_bus = "unix:///var/run/vyra/swarm.sock"
heartbeat_interval = 5000
agent_timeout = 30000

[channel_0]
enabled = true
context_persistence = true
context_file = "/var/lib/vyra/channel_0/context.json"
max_context_tokens = 32000
macros_file = "/etc/vyra/macros.yaml"

[visual]
theme = "neon-ritual"
enable_glyphs = true
enable_sounds = true
enable_backgrounds = true
focus_trance_mode = true
clarity_pulse_mode = true

[audio]
enable_keypress_sounds = true
keypress_sound_pack = "mechanical-neon"
background_beats = true
beat_engine = "lo-fi-trap"
volume = 0.3

[development]
default_editor = "nvim"
git_signing = true
auto_format = true
lsp_enabled = true

[docker]
socket = "/var/run/docker.sock"
default_network = "vyra-net"
gpu_passthrough = true

[security]
firewall = true
sandbox_agents = true
gpg_agent = true
ssh_agent = true

[portability]
external_boot = true
persistent_home = true
encryption = "luks2"
compression = "zstd"
