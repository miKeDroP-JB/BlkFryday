# ╔══════════════════════════════════════════════════════════════════════╗
# ║  VYRA: GENESIS SECTOR - KITTY TERMINAL CONFIGURATION                ║
# ║  Dark Neon Terminal Aesthetic                                        ║
# ╚══════════════════════════════════════════════════════════════════════╝

# === FONT CONFIGURATION ===
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# === CURSOR ===
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# === SCROLLBACK ===
scrollback_lines 10000
scrollback_pager bat --style=plain --paging=always

# === MOUSE ===
mouse_hide_wait 3.0
url_style curly
open_url_with default
url_prefixes http https file ftp gemini irc gopher mailto news git
detect_urls yes
copy_on_select clipboard

# === PERFORMANCE ===
repaint_delay 10
input_delay 3
sync_to_monitor yes

# === WINDOW ===
remember_window_size  yes
initial_window_width  120c
initial_window_height 35c
window_padding_width  12
window_margin_width   0
hide_window_decorations no
confirm_os_window_close 0

# === TABS ===
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold

# === AUDIO ===
enable_audio_bell no
visual_bell_duration 0.0

# === SHELL ===
shell zsh
editor nvim
term xterm-256color

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  VYRA DRACULA NEON THEME                                             ║
# ╚══════════════════════════════════════════════════════════════════════╝

# Background and foreground
background            #1a1b26
foreground            #c0caf5
selection_background  #33467c
selection_foreground  #c0caf5

# Cursor colors
cursor                #bb9af7
cursor_text_color     #1a1b26

# URL underline color
url_color             #73daca

# Tab bar colors
active_tab_foreground   #1a1b26
active_tab_background   #bb9af7
inactive_tab_foreground #787c99
inactive_tab_background #24283b
tab_bar_background      #1a1b26

# Normal colors
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# Bright colors
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Extended colors for full Neon Ritual support
color16 #ff9e64
color17 #db4b4b

# === KEYBOARD SHORTCUTS ===
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+enter new_window
map ctrl+shift+n new_os_window
map ctrl+shift+f toggle_fullscreen
map ctrl+shift+u kitten unicode_input
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# VYRA Quick Commands
map ctrl+shift+s launch --type=overlay vyra swarm status
map ctrl+shift+a launch --type=overlay vyra agent list
map ctrl+shift+0 launch --type=overlay vyra channel 0
