# VYRA: Genesis Sector - Pacman Configuration
# Optimized for maximum package availability

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Core Arch repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR for pre-built AUR packages
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

# Garuda Linux repository for theming
[garuda]
Include = /etc/pacman.d/garuda-mirrorlist
