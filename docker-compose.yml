# ====================================================
#  BRAIN NETWORK - DOCKER COMPOSE
# ====================================================
#  Full stack deployment with Redis for state
# ====================================================

version: '3.8'

services:
  # Brain Network Web Application
  brain-network:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - exports:/app/public/exports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/brain-network?action=status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for state management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - brain-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis-data:
  exports:

networks:
  default:
    name: brain-network
