apiVersion: apps/v1
kind: Deployment
metadata:
  name: process
  namespace: fractal-memory
  labels:
    app: process
spec:
  replicas: 3
  selector:
    matchLabels:
      app: process
  template:
    metadata:
      labels:
        app: process
    spec:
      containers:
        - name: process
          image: fractal-memory/process:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: fractal-memory-config
            - secretRef:
                name: fractal-memory-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: process
  namespace: fractal-memory
spec:
  selector:
    app: process
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: process-hpa
  namespace: fractal-memory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: process
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
