apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture
  namespace: fractal-memory
  labels:
    app: capture
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capture
  template:
    metadata:
      labels:
        app: capture
    spec:
      containers:
        - name: capture
          image: fractal-memory/capture:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: fractal-memory-config
            - secretRef:
                name: fractal-memory-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: capture
  namespace: fractal-memory
spec:
  selector:
    app: capture
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
