apiVersion: apps/v1
kind: Deployment
metadata:
  name: surface
  namespace: fractal-memory
  labels:
    app: surface
spec:
  replicas: 2
  selector:
    matchLabels:
      app: surface
  template:
    metadata:
      labels:
        app: surface
    spec:
      containers:
        - name: surface
          image: fractal-memory/surface:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: fractal-memory-config
            - secretRef:
                name: fractal-memory-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: surface
  namespace: fractal-memory
spec:
  selector:
    app: surface
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
