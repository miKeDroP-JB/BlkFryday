apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: fractal-memory
  labels:
    app: orchestrator
    component: conductor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        component: conductor
    spec:
      serviceAccountName: orchestrator-sa
      containers:
        - name: orchestrator
          image: fractal-memory/orchestrator:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fractal-memory-config
            - secretRef:
                name: fractal-memory-secrets
          env:
            - name: CAPTURE_URL
              value: "http://capture.fractal-memory.svc.cluster.local:8001"
            - name: PROCESS_URL
              value: "http://process.fractal-memory.svc.cluster.local:8002"
            - name: SURFACE_URL
              value: "http://surface.fractal-memory.svc.cluster.local:8003"
            - name: AUTH_URL
              value: "http://auth.fractal-memory.svc.cluster.local:8004"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: fractal-memory
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-hpa
  namespace: fractal-memory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestrator-ingress
  namespace: fractal-memory
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - api.fractal-memory.yourdomain.com
      secretName: fractal-api-tls
  rules:
    - host: api.fractal-memory.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 8000
