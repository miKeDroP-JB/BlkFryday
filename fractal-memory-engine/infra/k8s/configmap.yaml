apiVersion: v1
kind: ConfigMap
metadata:
  name: fractal-memory-config
  namespace: fractal-memory
data:
  # Service ports
  CAPTURE_PORT: "8001"
  PROCESS_PORT: "8002"
  SURFACE_PORT: "8003"

  # Feature flags
  ENABLE_LLM_FUSION: "true"
  ENABLE_EDGE_CACHE: "true"

  # Decay defaults
  DEFAULT_LAMBDA: "0.05"
  PRUNE_THRESHOLD: "0.05"

  # Cache TTL (seconds)
  PROFILE_CACHE_TTL: "3600"
  SNIPPET_CACHE_TTL: "1800"
