name: Fractal Memory Engine CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'fractal-memory-engine/**'
  pull_request:
    branches: [main]
    paths:
      - 'fractal-memory-engine/**'

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: gcr.io
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fractal-memory-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx ruff mypy
          pip install -r services/capture/requirements.txt

      - name: Lint with ruff
        run: ruff check shared services

      - name: Type check with mypy
        run: mypy shared --ignore-missing-imports || true

      - name: Run unit tests
        run: pytest tests/ -v --tb=short || true

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and push Capture
        uses: docker/build-push-action@v5
        with:
          context: fractal-memory-engine
          file: fractal-memory-engine/services/capture/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/fractal-memory/capture:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Process
        uses: docker/build-push-action@v5
        with:
          context: fractal-memory-engine
          file: fractal-memory-engine/services/process/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/fractal-memory/process:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Surface
        uses: docker/build-push-action@v5
        with:
          context: fractal-memory-engine
          file: fractal-memory-engine/services/surface/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/fractal-memory/surface:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Capture Service
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: fractal-capture
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/fractal-memory/capture:${{ github.sha }}
          region: us-central1

      - name: Deploy Process Service
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: fractal-process
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/fractal-memory/process:${{ github.sha }}
          region: us-central1

      - name: Deploy Surface Service
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: fractal-surface
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/fractal-memory/surface:${{ github.sha }}
          region: us-central1

  deploy-cloud-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Evolve Function
        run: |
          gcloud functions deploy fractal-evolve \
            --runtime python311 \
            --trigger-http \
            --source fractal-memory-engine/services/evolve \
            --entry-point main \
            --region us-central1

      - name: Deploy Calibration Function
        run: |
          gcloud functions deploy fractal-calibration \
            --runtime python311 \
            --trigger-http \
            --source fractal-memory-engine/services/calibration \
            --entry-point main \
            --region us-central1

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-cloud-run]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          chmod +x fractal-memory-engine/scripts/smoke_tests.sh
          fractal-memory-engine/scripts/smoke_tests.sh
        env:
          CAPTURE_URL: ${{ secrets.CAPTURE_SERVICE_URL }}
          PROCESS_URL: ${{ secrets.PROCESS_SERVICE_URL }}
          SURFACE_URL: ${{ secrets.SURFACE_SERVICE_URL }}
